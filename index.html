<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#faf8f3;color:#292722}
header{position:sticky;top:0;z-index:10;background:#fffdf8;border-bottom:1px solid #ddd;padding:10px 12px;display:flex;gap:10px;align-items:center}

.tools,.tags,.bulk{display:flex;gap:7px;overflow:auto;padding:8px 0}.tags button{white-space:nowrap}.active{font-weight:700;border:2px solid #333}
.book{background:white;border:1px solid #ddd;border-radius:12px;padding:11px;margin:8px 0;display:flex;gap:9px;align-items:flex-start}
.bookmain{flex:1}.book small{display:block;color:#666;margin-top:4px}.tagline{font-size:13px;margin-top:5px;color:#675}.pick{width:22px;height:22px}
#menu{position:fixed;right:0;top:0;width:min(82vw,320px);height:100vh;background:white;z-index:30;padding:58px 12px;box-shadow:-4px 0 18px #0003}#menu button{display:block;width:100%;text-align:left;margin:5px 0}
dialog{width:min(92vw,520px);border:0;border-radius:14px;padding:18px}dialog label{display:block;margin:9px 0}dialog input:not([type=checkbox]),dialog textarea{width:100%;padding:9px}
.status{background:#eef8ee;border:1px solid #b9d9b9;padding:9px;border-radius:10px;margin-bottom:10px}
.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}.checkgrid label{display:flex;gap:7px;align-items:center;margin:0!important;padding:8px;border:1px solid #ddd;border-radius:9px}.checkgrid input{width:20px!important;height:20px}.danger{border-color:#b44;color:#a22}fieldset{border:1px solid #ddd;border-radius:10px;margin:10px 0;padding:10px}legend{font-weight:700}.tags{flex-wrap:nowrap}
.edit-actions{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;margin-top:14px}
.edit-actions button{min-height:52px;font-size:18px;font-weight:700;padding:10px 16px;white-space:nowrap}
.edit-actions .delete-action{min-height:42px;font-size:14px;font-weight:600;padding:7px 10px}
@media(max-width:430px){
  .edit-actions{grid-template-columns:1fr 1fr auto;gap:7px}
  .edit-actions button{font-size:17px;padding:9px 11px}
  .edit-actions .delete-action{font-size:13px;padding:6px 8px}
}

/* スマホ用：まとめて編集を縦に整理 */
#bulkbar{
  display:grid !important;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:stretch;
  margin:12px 0 18px;
}
#bulkbar #selected{
  grid-column:1 / -1;
  font-size:18px;
  padding:4px 2px;
}
#bulkbar select{
  width:100%;
  min-width:0;
  min-height:48px;
  font-size:16px;
  padding:8px;
}
#bulkbar button{
  min-height:48px;
  font-size:16px;
  font-weight:700;
  padding:8px 10px;
  white-space:normal;
}
#bulkbar #bulkAge{grid-column:1 / -1}
#bulkbar #bulkTag{grid-column:1 / -1}
#bulkbar #bulkDone{grid-column:1 / -1}
@media(min-width:700px){
  #bulkbar{
    grid-template-columns:auto minmax(160px,1fr) auto auto minmax(160px,1fr) auto auto auto;
    align-items:center;
  }
  #bulkbar #selected,
  #bulkbar #bulkAge,
  #bulkbar #bulkTag,
  #bulkbar #bulkDone{grid-column:auto}
}

/* まとめて編集：スマホ固定レイアウト */
#bulkBar.bulk-edit-panel{
  display:block;
  overflow:visible;
  padding:12px 0 18px;
}
#bulkBar[hidden]{display:none !important}
.bulk-selected{
  font-size:18px;
  margin:0 0 10px;
}
.bulk-section{
  background:#f7f7f7;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin:10px 0;
}
.bulk-label{
  font-size:16px;
  font-weight:700;
  margin-bottom:8px;
}
#bulkBar select{
  display:block;
  width:100%;
  height:50px;
  min-width:0;
  box-sizing:border-box;
  font-size:16px;
  padding:8px 12px;
  border:1px solid #bbb;
  border-radius:10px;
  background:white;
}
.bulk-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
#bulkBar .bulk-actions button{
  width:100%;
  min-width:0;
  min-height:48px;
  padding:8px 6px;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
}
#bulkBar .bulk-finish{
  display:block;
  width:100%;
  min-height:48px;
  margin-top:12px;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
}
.shop-dialog{width:min(92vw,520px);border:0;border-radius:18px;padding:18px}.shop-dialog::backdrop{background:rgba(0,0,0,.45)}.shop-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.shop-head strong{font-size:24px}.shop-sub{font-size:13px;color:#666}.shop-primary{width:100%;min-height:54px;font-size:18px;font-weight:700}.shop-or{text-align:center;color:#777;margin:13px}.shop-label{font-weight:700}.shop-input-row{display:grid;grid-template-columns:1fr auto;gap:8px}.shop-input-row input{width:100%;box-sizing:border-box;min-height:50px;font-size:18px;padding:8px}.shop-input-row button{min-height:50px}.shop-result{margin-top:16px}.shop-empty,.shop-owned,.shop-notowned{padding:14px;border-radius:12px}.shop-empty{background:#f5f5f5;color:#666}.shop-owned{background:#eaf7ec;border:1px solid #a9d7af}.shop-notowned{background:#fff6df;border:1px solid #e7c86c}.shop-status{font-size:21px;font-weight:800}.shop-title{font-size:19px;font-weight:800;margin-top:7px}.shop-meta{margin-top:5px;color:#555}.camera-area{position:relative;background:#111;border-radius:14px;overflow:hidden;margin-bottom:10px;aspect-ratio:4/3}#barcodeVideo,#editBarcodeVideo{width:100%;height:100%;object-fit:cover}.scan-guide{position:absolute;left:8%;right:8%;top:43%;height:14%;border:2px solid white;border-radius:8px}#registerBook>input,#registerBook textarea{display:block;width:100%;box-sizing:border-box;min-height:48px;font-size:16px;padding:9px 11px;margin:5px 0 13px;border:1px solid #ccc;border-radius:9px}#registerBook textarea{min-height:90px}.register-fav{display:flex;align-items:center;gap:8px;font-weight:700;margin:12px 0}.register-fav input{width:22px;height:22px}.shop-register-btn{width:100%;margin-top:12px;min-height:46px;font-weight:700}.program-filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}.program-filters select{min-height:42px;border:1px solid #ccc;border-radius:9px;background:white;padding:6px 10px;font-size:15px}.program-info{padding:9px 11px;margin:8px 0 12px;background:#f5f7f2;border-radius:9px;font-size:13px}.program-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.program-badge,.data-badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2e8;font-size:11px}.data-badge{background:#f1f1f1}.data-badge.complete{background:#e6f4e8}</style></head>
<body>
<header><button id="menuBtn">☰</button><b>けんちゃんの本棚</b></header>
<aside id="menu" hidden>
<button id="menuShelf">📚 本棚</button>
<button id="openShopCheck">📷 店頭チェック</button>
<button id="openRegister">➕ 本を登録</button>
<button disabled>📖 読み聞かせ（次段階）</button>
<button disabled>🔎 さがす・候補（次段階）</button>
<button disabled>📊 分析（次段階）</button>
<button disabled>📝 月間記録（次段階）</button>
<button disabled>⚙️ 設定（次段階）</button>
</aside>
<main>
<div class="status" id="status">本棚データを確認中…</div>
<h1>本棚</h1><div class="count" id="count"></div>
<input id="search" placeholder="タイトル・作者・出版社・ISBNで検索">
<div class="tools"><button id="bulkOn">☑ まとめて編集</button><button id="newTag">＋ タグ作成</button></div>
<div class="tags" id="ageTabs"></div>
<div class="program-filters"><select id="programFilter"><option value="all">推薦区分：すべて</option><option value="kumon">KUMON推薦</option><option value="5A">KUMON 5A</option><option value="4A">KUMON 4A</option><option value="3A">KUMON 3A</option><option value="2A">KUMON 2A</option><option value="kaho">家庭保育園</option><option value="すくすく館">家庭保育園 すくすく館</option><option value="なかよし館">家庭保育園 なかよし館</option></select><select id="completeFilter"><option value="all">データ：すべて</option><option value="incomplete">未完了のみ</option><option value="complete">完了のみ</option></select></div>
<div class="tags" id="tagTabs"></div>
<div class="bulk-edit-panel" id="bulkBar" hidden>
  <div class="bulk-selected"><b id="selected">0冊</b> 選択</div>

  <section class="bulk-section">
    <div class="bulk-label">対象年齢</div>
    <select id="bulkAge">
      <option value="">年齢を選択</option>
      <option>0歳</option><option>1歳</option><option>2歳</option>
      <option>3歳</option><option>4歳</option><option>5歳</option><option>6歳</option>
    </select>
    <div class="bulk-actions">
      <button id="addAge">年齢を追加</button>
      <button id="removeAge">年齢を解除</button>
    </div>
  </section>

  <section class="bulk-section">
    <div class="bulk-label">タグ</div>
    <select id="bulkTag"></select>
    <div class="bulk-actions">
      <button id="addTag">タグを追加</button>
      <button id="removeTag">タグを解除</button>
    </div>
  </section>

  <button id="bulkOff" class="bulk-finish">まとめて編集を終了</button>
</div>
<div id="list"></div>
</main>
<dialog id="registerBook" class="shop-dialog">
<div class="shop-head"><div><strong>本を登録</strong><div class="shop-sub">新しい本を本棚に追加</div></div><button id="registerClose">閉じる</button></div>
<label class="shop-label">ISBN</label><input id="rIsbn" inputmode="numeric" placeholder="978XXXXXXXXXX">
<label class="shop-label">タイトル *</label><input id="rTitle"><label class="shop-label">作者</label><input id="rAuthor">
<label class="shop-label">出版社</label><input id="rPublisher">
<fieldset><legend>対象年齢（複数可）</legend><div id="registerAgeChecks" class="checkgrid"></div></fieldset>
<fieldset><legend>タグ（複数可）</legend><div id="registerTagChecks" class="checkgrid"></div></fieldset>
<label class="register-fav"><input id="rFav" type="checkbox"> ★ お気に入り</label>
<label class="shop-label">備考</label><textarea id="rNotes"></textarea>
<button id="registerSave" class="shop-primary">本棚に登録</button><div id="registerMsg"></div>
</dialog>
<dialog id="shopCheck" class="shop-dialog">
<div class="shop-head"><div><strong>店頭チェック</strong><div class="shop-sub">BOOKOFFなどでISBNを確認</div></div><button id="shopClose" type="button">閉じる</button></div>
<div id="cameraArea" class="camera-area" hidden><video id="barcodeVideo" playsinline muted></video><div class="scan-guide"></div></div>
<button id="startScan" type="button" class="shop-primary">📷 バーコードを読み取る</button>
<div class="shop-or">または</div><label class="shop-label">ISBNを入力</label>
<div class="shop-input-row"><input id="shopIsbn" inputmode="numeric" autocomplete="off" placeholder="978XXXXXXXXXX"><button id="shopSearch" type="button">確認</button></div>
<div id="shopResult" class="shop-result"><div class="shop-empty">ISBNを読み取るか入力してください。</div></div>
</dialog>
<dialog id="edit"><h2>本を編集</h2><input id="eid" type="hidden">
<label>タイトル<input id="etitle"></label><label>作者<input id="eauthor"></label><label>出版社<input id="epublisher"></label>
<label>ISBN<input id="eisbn" inputmode="numeric" placeholder="978/979から始まる13桁"></label>
<label>書籍JAN第2段（192）<input id="ejan2" inputmode="numeric" placeholder="192から始まる13桁"></label>
<div class="tools"><button id="editScanCode" type="button">📷 コードを読み取る</button></div>
<div id="editCameraArea" class="camera-area" hidden><video id="editBarcodeVideo" playsinline muted></video><div class="scan-guide"></div></div>
<div id="editCodeMsg" class="shop-sub"></div>
<div id="programInfo" class="program-info"></div><label>Cコード<input id="eccode" readonly placeholder="192コードから自動取得"></label>
<label>本体価格（税抜・円）<input id="eprice" inputmode="numeric" readonly placeholder="192コードから自動取得"></label>
<fieldset><legend>対象年齢（複数可）</legend><div id="ageChecks" class="checkgrid"></div></fieldset>
<fieldset><legend>タグ（複数可）</legend><div id="editTagChecks" class="checkgrid"></div><button id="editNewTag" type="button">＋ 新しいタグ</button></fieldset>
<label><input id="efav" type="checkbox"> ★ お気に入り</label><label>備考<textarea id="enotes"></textarea></label>
<div class="tools edit-actions"><button id="save" class="primary-action">登録</button><button id="cancel" class="cancel-action">キャンセル</button><button id="deleteBook" class="danger delete-action">削除</button></div></dialog>
